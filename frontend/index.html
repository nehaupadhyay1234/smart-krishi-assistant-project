 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Krishi Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
</head>

<body>

<header class="bg-success text-white p-3">
    <div class="container d-flex justify-content-between">
        <h3>🌾 Smart Krishi Assistant</h3>

        <nav>
            <a href="index.html" class="text-white me-3">Home</a>
            <a href="about.html" class="text-white me-3"></a>
            <a href="contact.html" class="text-white"></a>
        </nav>
    </div>
</header>

<div class="container mt-4">

    <div class="row">

        <!-- Left Side -->

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    Farm Map
                </div>

                <div class="card-body">

                    <div id="map" style="height:450px;"></div>

                </div>

            </div>

        </div>

        <!-- Right Side -->

        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    Farm Details
                </div>

                <div class="card-body">

                    <label class="form-label">Select Crop</label>

                    <select id="crop" class="form-select">

                        <option value="">Choose Crop</option>

                        <option value="Rice">Rice</option>

                        <option value="Wheat">Wheat</option>

                        <option value="Soybean">Soybean</option>

                        <option value="Cotton">Cotton</option>

                        <option value="Maize">Maize</option>

                        <option value="Sugarcane">Sugarcane</option>

                        <option value="Gram">Gram</option>

                    </select>

                    <br>

                    <button id="calculateBtn" class="btn btn-success">
                        Calculate
                    </button>

                    <button id="resetBtn" class="btn btn-danger">
                        Reset
                    </button>

                    <button id="generateReport" class="btn btn-primary mt-2">
                        Generate PDF Report
                    </button>

                    <hr>

                    <h5>Results</h5>

                    <p>
                        Area :
                        <span id="area">0</span>
                        sq.m
                    </p>

                    <p>
                        Water Required :
                        <span id="water">0</span>
                        Liters
                    </p>

                    <p>
                        Pesticide Required :
                        <span id="pesticide">0</span>
                        Liters
                    </p>

                    <p>
                        Fertilizer :
                        <span id="fertilizer">-</span>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center mt-5 mb-3">

    © 2026 Smart Krishi Assistant

</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Project JS -->

<script src="js/crops.js"></script>
<script src="js/map.js"></script>
<script src="js/calculator.js"></script>
<script src="js/api.js"></script>
<script src="js/weather.js"></script>
<script src="js/report.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>

</body>
</html>
